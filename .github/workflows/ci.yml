name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e .
      - name: Lint (ruff)
        run: ruff check .
      - name: Unit tests (synthetic data, no download)
        run: pytest -q
      - name: Check committed metadata is consistent
        run: python scripts/validate_metadata.py
